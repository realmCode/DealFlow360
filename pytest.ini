[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = .
# Fixtures AND tests must share one event loop. asyncpg binds a connection to
# the loop that created it, so a session-scoped engine handed to a
# function-scoped test loop raises "attached to a different loop".
#
# Pinning both scopes here is what lets the engine use a real connection pool
# under test. Without it the suite needs NullPool, which opens a fresh TCP
# connection and auth handshake per statement — measured at ~133 ms/query
# against Dockerised PostgreSQL versus ~4.8 ms pooled, i.e. roughly 28x
# slower, and a single test issues dozens of statements.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose.*
markers =
    concurrency: exercises database row locking under concurrent transactions
