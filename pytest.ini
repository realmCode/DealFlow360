[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose.*
markers =
    concurrency: exercises database row locking under concurrent transactions
